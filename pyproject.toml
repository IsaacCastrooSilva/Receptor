[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "receptor"
version = "0.1.0"
description = "Protótipo local de apoio à comunicação em português"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.121,<1", "starlette>=0.47,<2", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]
ml = [
    "numpy>=1.26,<3",
    "torch>=2.6,<3",
    "transformers>=4.57.1,<5",
    "accelerate>=1.0,<2",
]
dev = ["ruff>=0.11,<1", "httpx>=0.28,<1"]

[project.scripts]
receptor = "receptor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
